
name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-json:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Validate JSON Schema files
      run: |
        for file in schema/*.json; do
          echo "Checking $file"
          python3 -m json.tool "$file" > /dev/null
        done
        echo "✓ All schema JSON files are valid"

    - name: Validate JSON-LD example files
      run: |
        for file in examples/*.jsonld; do
          echo "Checking $file"
          python3 -m json.tool "$file" > /dev/null
        done
        echo "✓ All example JSON-LD files are valid"

  check-documentation:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Check required documentation exists
      run: |
        test -f README.md && echo "✓ README.md present"
        test -f LICENSE && echo "✓ LICENSE present"
        test -f docs/SPECIFICATION.md && echo "✓ SPECIFICATION.md present"
        echo "✓ All required documentation files present"

  summary:
    runs-on: ubuntu-latest
    needs: [validate-json, check-documentation]
    if: always()

    steps:
    - name: CI Pipeline Summary
      run: |
        echo "### CI Pipeline Results 📊"
        echo "- JSON Validation: ${{ needs.validate-json.result }}"
        echo "- Documentation Check: ${{ needs.check-documentation.result }}"
        if [ "${{ needs.validate-json.result }}" = "failure" ] || [ "${{ needs.check-documentation.result }}" = "failure" ]; then
          echo "❌ CI Pipeline FAILED"
          exit 1
        else
          echo "✅ CI Pipeline PASSED"
        fi
